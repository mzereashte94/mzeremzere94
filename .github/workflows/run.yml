name: Auto Generate JSON Files

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests selenium webdriver-manager

      - name: Run extractor script for apps
        run: python extractor.py

      - name: Run extractor script for IPAs
        run: python extract_ips.py

      - name: Commit and push generated JSON files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git stash
          git pull origin main --rebase || true
          git stash pop || true
          git add ashtemobile94.json ashteips.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update JSON files" && git push)
