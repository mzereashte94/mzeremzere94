name: Auto Extract & Upload Real IPAs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch Real IPA Files
        run: python download_ipas.py

      - name: Upload IPA Files to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "AshteMobile Original IPA Release - Build ${{ github.run_number }}"
          body: "فایلێن IPA یێن ڕاستەقینە ب بێ Sign و ب قەبارەیا ڕاستەقینە هاتینە داگرتن."
          files: "*.ipa"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
