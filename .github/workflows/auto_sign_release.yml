name: Auto Download, Sign & Upload Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # ڕۆژانە کاژێر ۲ی شەوە خۆکارانە ڕان دەبێت

permissions:
  contents: write

jobs:
  sign-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Auto Sign & Release Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, requests, os, subprocess

          JSON_FILE = 'ashteips.json'
          if not os.path.exists(JSON_FILE):
              print('JSON File not found!')
              exit(0)

          with open(JSON_FILE, 'r', encoding='utf-8') as f:
              apps = json.load(f)

          for app in apps:
              name = app.get('name', 'App').replace(' ', '_')
              url = app.get('download_url') or app.get('install_url')
              
              if not url or not url.startswith('http'):
                  continue

              print(f'Downloading {name} from {url}...')
              ipa_path = f'{name}.ipa'
              try:
                  res = requests.get(url, timeout=60)
                  if res.status_code == 200:
                      with open(ipa_path, 'wb') as ipa_f:
                          ipa_f.write(res.content)
                      print(f'Successfully downloaded {ipa_path}')
                  else:
                      print(f'Failed download for {name}')
              except Exception as e:
                  print(f'Error downloading {name}: {e}')
          "

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "AshteMobile Signed Apps Update - Build ${{ github.run_number }}"
          body: "ئەم فایلی IPAیانە خۆکارانە لە ڕێگەی سۆرسەوە هاتونەتە داگرتن و ئامادەکردن."
          files: "*.ipa"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
